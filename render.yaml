# Render Blueprint — PyKnowledge v0.5.0
# Deploys: static frontend + Node API server + PostgreSQL
#
# After first deploy:
#   1. Set CORS_ORIGIN on the API service to your static site URL
#      (https://pyknowledge-client.onrender.com)
#   2. Set API_URL on the static site to your API URL
#      (https://pyknowledge-api.onrender.com)
#   3. Run migrations: npm run db:migrate -w pyknowledge-server

services:
  # ── Static frontend ─────────────────────────────────────────────
  # Serves root directory as-is (plain HTML/CSS/JS, no build step).
  # Hash-based routing works without rewrites.
  - type: static_site
    name: pyknowledge-client
    repo: https://github.com/kerrfairtex/PyKnowledge
    branch: main
    autoDeploy: true
    buildCommand: node scripts/render-build.js
    publishPath: .
    envVars:
      - key: API_URL
        value: "" # ← set to https://pyknowledge-api.onrender.com after deploy
    headers:
      - path: /core/service-worker.js
        name: Cache-Control
        value: "no-cache"
      - path: /manifest.json
        name: Cache-Control
        value: "public, max-age=86400"
      - path: /ui/assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /ui/themes/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"

  # ── API server ──────────────────────────────────────────────────
  # Express + Prisma backend for auth, content sync, and progress
  - type: web
    name: pyknowledge-api
    runtime: node
    repo: https://github.com/kerrfairtex/PyKnowledge
    branch: main
    autoDeploy: true
    buildCommand: cd server && npm install --ignore-scripts
    startCommand: cd server && npx prisma generate && node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: DATABASE_URL
        fromDatabase:
          name: pyknowledge-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "" # ← set to https://pyknowledge-client.onrender.com after deploy

databases:
  # ── PostgreSQL ──────────────────────────────────────────────────
  - name: pyknowledge-db
    plan: free
    ipAllowList: [] # API-only via private network
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PyKnowledge - Offline Python Learning Platform for TRAC/BARMM/CHED curriculum">
  <meta name="theme-color" content="#16213e">
  <meta name="color-scheme" content="dark">
  <title>PyKnowledge</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="ui/themes/default.css">
  <link rel="stylesheet" href="ui/themes/animations.css">
  <link rel="stylesheet" href="ui/themes/landing.css">
  <link rel="icon" href="ui/assets/icon-192.png" type="image/png">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="app">

      <h1>PyKnowledge</h1>
      <p class="tagline">Offline Python Learning Platform</p>
      <nav id="main-nav" aria-label="Main navigation"></nav>

      <p>PyKnowledge requires JavaScript to run. Please enable JavaScript in your browser.</p>
    </div>

  <script>window.PYKNOWLEDGE_API_URL = window.PYKNOWLEDGE_API_URL || '';</script>
  <script type="module" src="core/engine.js"></script>
